<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<link rel="preload" href="fonts/commissioner.woff" as="font" type="font/woff" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>Morfeas — Anesthesia Assistant</title>

<!-- Link preview card (WhatsApp, Viber, Messenger, email, social). Absolute URLs are required. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Morfeas" />
<meta property="og:locale" content="el_GR" />
<meta property="og:title" content="Morfeas" />
<meta property="og:url" content="https://lilia33t.github.io/Morfeas/" />
<meta property="og:image" content="https://lilia33t.github.io/Morfeas/icons/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Morfeas" />
<meta name="twitter:card" content="summary_large_image" />

<!-- PWA / iOS standalone -->
<meta name="theme-color" content="#1D3D6B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Morfeas" />
  <!-- Keep the app out of search engines. This is discoverability, not access
       control: anyone with the link can still open it. Do NOT also block the
       page in robots.txt — a blocked crawler cannot read this tag. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-v2.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png" />

<style>
  /* Commissioner (SIL OFL), self-hosted under its own family name so a font
     installed on the phone, or a failed Google Fonts download, can never
     replace it. Variable weight 300-800, Latin + Greek subset. */
  @font-face {
    font-family: "Morfeas Sans";
    src: url("fonts/commissioner.woff") format("woff");
    font-weight: 300 800;
    font-style: normal;
    font-display: swap;
  }
  html, body {
    margin: 0; padding: 0;
    background: #EAF0F8;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
    font-family: "Morfeas Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  #root { min-height: 100vh; min-height: 100dvh; }
  /* iOS safe-area padding at the very top/bottom */
  #root { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; }

  /* Splash while React boots */
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #EAF0F8; color: #1E3A5F; z-index: 9999;
    transition: opacity .3s ease; font-weight: 700;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  /* the splash is painted before React runs, so it needs its own dark variant */
  @media (prefers-color-scheme: dark) {
    html, body { background: #11161C; }
    #boot { background: #11161C; color: #E6EDF5; }
  }
  #boot svg { width: 54px; height: 54px; }
  /* Printing a checklist: only the print copy (#aa-print) is shown, black on white, on A4. */
  #aa-print { display: none; }
  @media print {
    @page { size: A4; margin: 14mm; }
    html, body { background: #fff !important; }
    body > *:not(#aa-print) { display: none !important; }
    #aa-print { display: block !important; color: #000; font-family: "Morfeas Sans", -apple-system, "Segoe UI", sans-serif; }
  }
  /* Respect the phone's "reduce motion" setting. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
  #boot .pulse { animation: dash 1.4s ease-in-out infinite; }
  @keyframes dash { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  /* Metronome dot in crisis mode: bright for the first half of each beat. */
  @keyframes aa-beat { 0% { opacity: 1; transform: scale(1.25); } 50% { opacity: .25; transform: scale(1); } }
</style>
</head>
<body>
<div id="boot">
  <img src="icons/icon-512-v2.png" alt="Morfeas" style="width:132px;height:132px;border-radius:26px;box-shadow:0 6px 24px rgba(20,37,63,.18)" />
  <div style="font-size:13px;letter-spacing:.3px;color:#42536A;margin-top:2px">Created by Efstathia Pistioli, MD</div>
</div>
<div id="root"></div>

<!-- React runtime (cached offline by the service worker after first load) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha512-QVs8Lo43F9lSuBykadDb0oSXDL/BbZ588urWVCRwSIoewQv/Ewg1f84mK3U790bZ0FfhFa1YSQUmIhG+pIRKeg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" integrity="sha512-6a1107rTlA4gYpgHAqbwLAtxmWipBdJFcq8y5S/aTge3Bp+VAklABm2LO+Kg51vOWR9JMZq1Ovjl5tpluNpTeQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<!-- App (pre-compiled, no in-browser Babel needed). Split into ordered
     modules for maintainability — plain classic scripts (no bundler, no
     ES-module import/export) so load order matters and must stay as-is. -->
<script src="src/data.js"></script>
<script src="src/formulas.js"></script>
<script src="src/primitives.js"></script>
<script src="src/tabs.js"></script>
<script src="src/root.js"></script>

<script>
  (function () {
    try {
      var root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(ErrorBoundary, null, React.createElement(AnesthesiaAssistant)));
      var boot = document.getElementById("boot");
      if (boot) { boot.classList.add("hide"); setTimeout(function(){ boot.remove(); }, 350); }
    } catch (e) {
      document.getElementById("boot").innerHTML =
        '<div style="padding:20px;text-align:center;color:#C9544B;font-size:14px">Σφάλμα φόρτισης.<br>Ελέγξτε τη σύνδεση και ανανεώστε.<br><br><small style="color:#8A8076">' + (e && e.message ? e.message : e) + '</small></div>';
    }
  })();

  // Service worker for offline use
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      // A first install also activates while this page is open; that is not an
      // update, so the banner is only for pages that already had a worker.
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (reg) {
        function showUpdateBanner() {
          if (document.getElementById("upd-banner")) return;
          var b = document.createElement("div");
          b.id = "upd-banner";
          b.innerHTML = "⬆️ Νέα έκδοση διαθέσιμη — <b>πατήστε για ανανέωση</b> / New version — <b>tap to refresh</b>";
          b.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:99999;" +
            "background:#1E3A5F;color:#fff;padding:12px 16px;border-radius:14px;font:600 13.5px/1.4 'Morfeas Sans',system-ui,sans-serif;" +
            "text-align:center;box-shadow:0 6px 20px rgba(20,37,63,.35);cursor:pointer";
          b.onclick = function () { location.reload(); };
          document.body.appendChild(b);
        }
        // New SW activated while an old page is in control → update ready
        reg.addEventListener("updatefound", function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener("statechange", function () {
            if (nw.state === "activated" && hadController) showUpdateBanner();
          });
        });
        // Re-check for updates when the app is reopened / brought to foreground
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) reg.update().catch(function () {});
        });
        setInterval(function () { reg.update().catch(function () {}); }, 60 * 60 * 1000);
      }).catch(function (err) {
        console.warn("SW registration failed:", err);
      });
    });
  }
</script>
</body>
</html>
